name = "ghost-guard"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Attach example.com/* on your proxied, self-hosted Ghost hostname.
# Ghost's routes ignore case: a /members* route alone misses /Members aliases.
# The Worker protects members routes, serves the script/webhook, and forwards
# all other traffic to Ghost.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SIGNUP_RATE_LIMITER"
class_name = "SignupRateLimiter"

[[durable_objects.bindings]]
name = "MEMBER_LABELLER"
class_name = "MemberLabeller"

[[durable_objects.bindings]]
name = "SETUP_STORE"
class_name = "SetupStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignupRateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MemberLabeller"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SetupStore"]

# Secrets: SETUP_TOKEN, CONFIRM_SECRET, GHOST_ORIGIN, TURNSTILE_SECRET,
# ADMIN_API_KEY and WEBHOOK_SECRET. Never commit real secrets.
# SETUP_TOKEN locks /ghost-guard/setup. The Deploy button asks for it
# (.dev.vars.example). The setup page can create the Turnstile and webhook
# secrets; it stores a copy in SETUP_STORE when the matching env value is unset.
[vars]
INTERSTITIAL_ACTIONS = "signup,subscribe,signup-paid"
SITE_TITLE = "this publication"
# With GHOST_ORIGIN set and Ghost in a subfolder: other paths go to the zone
# origin instead. Set it here, not only in the dashboard: wrangler deploy
# replaces dashboard vars. Signup protection does not depend on it.
# GHOST_BASE_PATH = "/blog"
# TURNSTILE_SECRET enables signup challenges. Put the public sitekey in the
# Code Injection snippet, not here. Hostname defaults to the request hostname.
# TURNSTILE_HOSTNAME = "example.com"
SIGNUP_IP_LIMIT = "5"
SIGNUP_IP_WINDOW_SECONDS = "3600"
SIGNUP_EMAIL_LIMIT = "3"
SIGNUP_EMAIL_WINDOW_SECONDS = "86400"
ADMIN_API_URL = ""
CLEANUP_ENABLED = "false"
CLEANUP_SKIP_DOMAINS = "gmail.com,googlemail.com,yahoo.com,outlook.com,hotmail.com,icloud.com,proton.me,protonmail.com,me.com,live.com,msn.com,aol.com,mail.com"
