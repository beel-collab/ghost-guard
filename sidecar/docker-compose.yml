services:
  signup-shield:
    build:
      context: ..
      dockerfile: sidecar/Dockerfile
    environment:
      GHOST_ORIGIN: http://ghost:2368
      SITE_TITLE: My Publication
      INTERSTITIAL_ACTIONS: signup,subscribe,signup-paid
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      SIGNUP_IP_LIMIT: ${SIGNUP_IP_LIMIT:-5}
      SIGNUP_IP_WINDOW_SECONDS: ${SIGNUP_IP_WINDOW_SECONDS:-3600}
      SIGNUP_EMAIL_LIMIT: ${SIGNUP_EMAIL_LIMIT:-3}
      SIGNUP_EMAIL_WINDOW_SECONDS: ${SIGNUP_EMAIL_WINDOW_SECONDS:-86400}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:8787:8787"
    # Attach this service to the same Docker network as Ghost.
